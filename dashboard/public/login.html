<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | CoreVitals</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <img src="/lotus.webp" alt="Lotus Psychiatry & Wellness" class="logo">
    <p class="eyebrow">CoreVitals dashboard</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to view your website reports.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="100" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <p id="loginError" role="alert" aria-live="polite"></p>
      <button id="loginButton" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
